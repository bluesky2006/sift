<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sift</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sift">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand"><img src="/icon.svg" alt="" width="26" height="26">Sift</a>
    <nav>
      <button id="check" class="ghost">Check now</button>
      <a href="#/bin" id="binlink" class="ghost">Bin</a>
      <button id="logout" class="ghost">Sign out</button>
    </nav>
  </header>
  <p class="status" id="status"></p>

  <div class="jobbar" id="jobbar" hidden>
    <span class="spinner" id="jobspin"></span>
    <span id="joblabel"></span>
    <button class="ghost small" id="jobclose" hidden>Close</button>
    <pre id="joboutput" hidden></pre>
  </div>

  <main id="view"></main>

  <div class="player" id="player" hidden>
    <button id="pp" class="round" aria-label="Play or pause">▶</button>
    <div class="pinfo">
      <div class="plabel"><span class="side" id="pside"></span><span id="ptitle"></span></div>
      <div class="pbar"><span id="ptime">0:00</span><input type="range" id="seek" min="0" max="0" step="0.1" value="0"><span id="plen">0:00</span></div>
    </div>
    <button id="ab" class="ab" title="Same moment in the other version">A/B</button>
    <button id="pclose" class="ghost small" aria-label="Close player">✕</button>
  </div>
  <audio id="audio" preload="none"></audio>

  <dialog id="dialog">
    <form method="dialog">
      <h3 id="dtitle"></h3>
      <p id="dbody"></p>
      <input type="password" id="dpassword" placeholder="Password" autocomplete="current-password" hidden>
      <p class="error" id="derror" hidden></p>
      <div class="dbuttons">
        <button type="button" id="dcancel" class="ghost">Cancel</button>
        <button value="ok" id="dok" class="primary">OK</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
